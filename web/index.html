<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Callboard is a real-time wallboard for Asterisk, FreePBX, and Vicidial queues."
    />
    <title>Callboard — VoIP wallboard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c6b4c'/%3E%3Cpath d='M9 12h14M9 16h10M9 20h6' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      (function () {
        var q = new URLSearchParams(location.search).get("theme");
        var stored = null;
        try { stored = localStorage.getItem("callboard-theme"); } catch (e) {}
        var theme = q === "dark" || q === "light" ? q : stored;
        if (theme !== "dark" && theme !== "light") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (q === "dark" || q === "light") {
          try { localStorage.setItem("callboard-theme", q); } catch (e) {}
        }
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
