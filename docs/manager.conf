; Callboard — Asterisk Manager user
;
; The wallboard logs in, sends Ping, and sends QueueStatus.
; It does not originate, hang up, or run CLI commands.
;
; AMI is cleartext. Keep `permit` to the dashboard host, or turn on AMI TLS
; (tlsenable / tlsbindaddr in [general]) and point AMI_PORT at the TLS port.
;
; Drop this file in the Asterisk config directory and include it from
; manager.conf:
;
;   #include "manager.d/callboard.conf"
;
; FreePBX: Settings → Asterisk Manager Users, or
; /etc/asterisk/manager_custom.conf. Do not reuse the admin user.

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
; displayconnects = no

[callboard]
secret = CHANGE_ME
deny = 0.0.0.0/0.0.0.0
permit = 10.0.0.12/255.255.255.255
; `agent` read receives queue and member events.
; `agent` write is what QueueStatus requires. Ping needs no write class.
read = system,call,agent,reporting
write = agent
writetimeout = 100
displayconnects = no
eventfilter = Event: (Queue|Agent|Hangup)
